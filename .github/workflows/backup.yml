name: Supabase Backup

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}   # can trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # pg_dump refuses to run against a server newer than itself, so we pull the matching
      # major version straight from the official PostgreSQL APT repo (PGDG) instead
      # UPDATE WHEN SERVER VERSION CHANGES
      - name: Install PostgreSQL 17 client tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
        

      - name: Create pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}   # direct connection, port 5432
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          FILENAME="library_backup_${TIMESTAMP}.dump"
          # -F c = custom format: compressed, supports selective/parallel restore
          # Scoped to: public schema, legacy schema, and just the auth.users table
          pg_dump "$DATABASE_URL" -F c -f "$FILENAME" \
            --schema=public \
            --schema=legacy 
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"

      - name: Encrypt backup (GPG symmetric)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "${BACKUP_FILE}.gpg" "$BACKUP_FILE"
          echo "BACKUP_FILE_ENC=${BACKUP_FILE}.gpg" >> "$GITHUB_ENV"

      # GitHub Actions artifact - 90 day retention
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE_ENC }}
          path: ${{ env.BACKUP_FILE_ENC }}
          retention-days: 90

      # Google Drive via rclone - 90 day retention
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: rclone copy "$BACKUP_FILE" "icsf_drive:LibraryDB-Backups/" --progress

      - name: Verify backup uploaded successfully
        run: |
          set -euo pipefail
          REMOTE_PATH="icsf_drive:LibraryDB-Backups/$(basename "$BACKUP_FILE")"
          SIZE=$(rclone size "$REMOTE_PATH" --json | jq -r '.bytes')

          if [ -z "$SIZE" ] || [ "$SIZE" -lt 10000 ]; then
            echo "::error::Uploaded backup is missing or suspiciously small ($SIZE bytes) at $REMOTE_PATH — skipping cleanup so older backups are NOT deleted."
            exit 1
          fi

          echo "Verified: $REMOTE_PATH is present on Drive ($SIZE bytes)."
      - name: Delete Drive backups older than 90 days
        run: rclone delete "icsf_drive:LibraryDB-Backups/" --min-age 90d
