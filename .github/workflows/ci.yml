name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NODE_ENV: test
      PORT: 4000
      SUPABASE_URL: https://s.supabase.co
      SUPABASE_SECRET_KEY: abc123

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @library/db generate

      - name: Typecheck API
        run: pnpm --filter @library/api typecheck

      - name: Lint web app
        run: pnpm --filter @library/web lint

      - name: Build web app
        run: pnpm --filter @library/web build
